version: 2

models:
  - name: stg_faers
    description: "One row per FAERS report, target drug and reaction. Report level fields (age, weight, seriousness flags) repeat on every reaction row, so count distinct report_id when counting reports. patient_age_years is converted from the unit on the report and is empty when the unit is missing."
    columns:
      - name: faers_key
        data_tests:
          - unique
          - not_null
      - name: report_id
        data_tests:
          - not_null
      - name: drug_name
        data_tests:
          - not_null
      - name: is_serious
        data_tests:
          - not_null
      - name: report_date
        data_tests:
          - not_null

  - name: stg_openfda_labels
    description: "One row per openFDA drug label and target drug. A combination label, such as one for losartan and hydrochlorothiazide, matches both drugs and appears twice."
    columns:
      - name: label_drug_key
        data_tests:
          - unique
          - not_null
      - name: label_id
        data_tests:
          - not_null
      - name: drug_name
        data_tests:
          - not_null

  - name: stg_pubmed_articles
    description: "One row per PubMed article and target drug. The same article can match more than one drug."
    columns:
      - name: article_drug_key
        data_tests:
          - unique
          - not_null
      - name: published_on
        data_tests:
          - not_null

  - name: stg_clinicaltrials_studies
    description: "One row per ClinicalTrials.gov study and target drug."
    columns:
      - name: study_drug_key
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["COMPLETED", "TERMINATED", "ACTIVE_NOT_RECRUITING"]
              config:
                severity: warn
      - name: started_on
        data_tests:
          - not_null

  - name: stg_clinicaltrials_adverse_events
    description: "One row per study, drug, adverse event term and seriousness, unnested from the raw adverse_events list. A few keys repeat because the extract lists some terms once per group, so the unique test only warns."
    columns:
      - name: event_key
        data_tests:
          - unique:
              config:
                severity: warn
          - not_null

  - name: stg_faers_counts
    description: "One row per drug and reaction with the report counts the PRR formula needs, taken from the openFDA count endpoint over all of FAERS. drug_reaction_reports is reports with the drug and the reaction, drug_reports is all reports with the drug, reaction_reports is all reports with the reaction, total_reports is every report in FAERS. Reaction names are upper case. For reactions whose name has an apostrophe (stored with ^ in part of the data) reaction_reports comes from a words search and is approximate, marked by reaction_total_approximate."
    columns:
      - name: drug_reaction_key
        data_tests:
          - unique
          - not_null
      - name: drug_reaction_reports
        data_tests:
          - not_null

  - name: stg_faers_windows
    description: "One row per drug and reaction seen at least 5 times in the last year, with report counts for that recent window and for all the years before it, and the total reports of the drug in each window. history_is_upper_bound is true when the reaction was missing from openFDA's top 1000 list for the history window, so history_reports is the most it could have been."
    columns:
      - name: drug_reaction_key
        data_tests:
          - unique
          - not_null
      - name: recent_reports
        data_tests:
          - not_null

  - name: stg_faers_monthly
    description: "One row per drug and calendar month with the number of FAERS reports received that month, and how many of them were marked serious, mention a hospitalization or mention a death. Counts come from the openFDA count endpoint over all of FAERS, grouped by the day the FDA received the report. Months before 2018 are not loaded, and the newest months can be incomplete because openFDA publishes FAERS quarterly."
    columns:
      - name: drug_month_key
        data_tests:
          - unique
          - not_null
      - name: reports
        data_tests:
          - not_null
