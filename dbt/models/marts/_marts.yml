version: 2

models:
  - name: mart_safety_signals
    description: "One row per drug and reaction with disproportionality scores computed from report counts over all of FAERS. prr is the proportional reporting ratio, ror the reporting odds ratio with its 95 percent interval, chi_squared the Pearson statistic. is_signal is true when there are at least 3 reports, prr is at least 2 and chi_squared is at least 4 (the Evans criteria). is_strong_signal is stricter: at least 10 reports and a lower 95 percent bound of prr of at least 2. Administrative and product terms listed in the excluded_reactions seed are left out. A high score means a reaction is reported disproportionately, it does not prove the drug causes it, and reactions that match what the drug is prescribed for score high too."
    columns:
      - name: drug_reaction_key
        data_tests:
          - unique
          - not_null
      - name: drug_name
        data_tests:
          - not_null
      - name: reaction
        data_tests:
          - not_null
      - name: is_signal
        data_tests:
          - not_null
      - name: is_strong_signal
        data_tests:
          - not_null

  - name: mart_drug_profile
    description: "One row per drug for the dashboard and for comparing two drugs side by side. drug_reports, scored_pairs, signals, strong_signals and top_signals (the five strongest signals by lower bound of prr, empty when there are none) come from counts over all of FAERS. The recent_ columns describe only the newest FAERS reports pulled for the drug (up to about 400 report and drug combinations), counted once per report, and recent_median_age_years is approximate."
    columns:
      - name: drug_name
        data_tests:
          - unique
          - not_null
      - name: drug_reports
        data_tests:
          - not_null

  - name: mart_emerging_signals
    description: "One row per drug and reaction comparing the share of the drug's reports that mention the reaction in the last year with the share in the years before. rate_ratio is recent rate over history rate (with 0.5 added to every count so a reaction never seen before still gets a finite value), rate_ratio_lower_95 its 95 percent lower bound. is_emerging is true when there are enough recent reports and the lower bound is high enough (see emerging_ settings in dbt_project.yml). When history_is_upper_bound is true the history count is the most it could have been, so the ratio can only be too low. A rising share can also come from news, lawsuits or changes in who reports, it does not show a new safety problem by itself."
    columns:
      - name: drug_reaction_key
        data_tests:
          - unique
          - not_null
      - name: is_emerging
        data_tests:
          - not_null

  - name: mart_risk_features
    description: "One row per FAERS report and drug, the training table for the risk model. is_serious is the FAERS seriousness flag of the report. Age, weight and sex are empty when the report does not give them, n_drugs is how many drugs the report lists. Several rows can share a report_id because one report can mention several of the 50 drugs, so models must split by report_id."
    columns:
      - name: report_drug_key
        data_tests:
          - unique
          - not_null
      - name: is_serious
        data_tests:
          - not_null
