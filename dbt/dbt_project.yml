name: pharmawatch
version: "1.0.0"
config-version: 2
profile: pharmawatch

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  pharmawatch:
    staging:
      +materialized: view
      +schema: pharmawatch_staging
    marts:
      +materialized: table
      +schema: pharmawatch_marts

vars:
  strong_signal_min_reports: 10
  strong_signal_min_prr_lower_95: 5
  emerging_min_recent_reports: 10
  emerging_min_rate_ratio_lower_95: 2
